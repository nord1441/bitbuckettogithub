[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bitbucket-to-github"
version = "0.1.0"
description = "Bulk-migrate Bitbucket Cloud repositories to GitHub (LFS aware)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
b2g = "b2g.__main__:main"

[tool.setuptools.packages.find]
include = ["b2g*"]
